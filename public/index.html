<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitor Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #00e676;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: #000;
            padding: 1rem 2rem;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Grid para os Cards ficarem Lado a Lado */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }

        .card h3 {
            margin: 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        .card p {
            font-size: 2.2rem;
            font-weight: bold;
            margin: 10px 0;
            color: var(--accent);
        }

        /* Classe de Alerta Crítico */
        .alerta-critico {
            background-color: rgba(255, 23, 68, 0.2) !important;
            border: 2px solid #ff1744 !important;
            animation: pulsar 1.5s infinite;
        }

        @keyframes pulsar {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 23, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 23, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 23, 68, 0);
            }
        }

        .chart-section {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #333;
        }

        footer {
            background: #000;
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h2>🚀 HardwareEngine <span style="font-weight: 300;">Monitor</span></h2>
        <div id="status-io">🟢 Online</div>
    </header>

    <main>
        <section class="status-grid">
            <div id="card-cpu" class="card" style="border-top: 4px solid #00e676;">
                <h3>USO DE CPU</h3>
                <p id="cpu-text">0%</p>
            </div>
            <div id="card-ram" class="card" style="border-top: 4px solid #2196f3;">
                <h3>MEMÓRIA RAM</h3>
                <p id="ram-text">0 GB</p>
            </div>
            <div id="card-temp" class="card" style="border-top: 4px solid #ff5252;">
                <h3>TEMPERATURA</h3>
                <p id="temp-text">0°C</p>
            </div>
        </section>

        <section class="chart-section">
            <canvas id="loadChart"></canvas>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Provads Monitoramento Real-Time</p>
    </footer>

    <script>
        const socket = io();

        // 1. Classe Base: Recebe o ID no construtor conforme o requisito
        class ComponenteMonitor {
            constructor(idElemento) {
                this.elemento = document.getElementById(idElemento);
                if (!this.elemento) {
                    console.error(`Elemento ${idElemento} não encontrado no HTML.`);
                }
            }
        }

        // 2. Classe Filha: CardHardware herda de ComponenteMonitor
        class CardHardware extends ComponenteMonitor {
            constructor(idCard, idTexto, limiteCritico) {
                super(idCard); // Passa o ID para a classe base
                this.elementoTexto = document.getElementById(idTexto);
                this.limiteCritico = limiteCritico;
            }

            // Método obrigatório: atualizarInterface(valor, tipo)
            atualizarInterface(valor, tipo) {
                // Atualiza o texto (Ex: "45 %" ou "12 GB")
                if (this.elementoTexto) {
                    this.elementoTexto.innerText = `${valor} ${tipo}`;
                }

                // Lógica de alerta usando o elemento herdado da classe base
                if (valor > this.limiteCritico) {
                    this.elemento.classList.add('alerta-critico');
                } else {
                    this.elemento.classList.remove('alerta-critico');
                }
            }
        }

        // 3. Classe para o Gráfico (também herda da base para achar o Canvas)
        class GraficoMonitor extends ComponenteMonitor {
            constructor(idCanvas) {
                super(idCanvas);
                this.chart = new Chart(this.elemento.getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Uso de CPU (%)',
                            data: [],
                            borderColor: '#00e676',
                            backgroundColor: 'rgba(0, 230, 118, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
                });
            }

            desenhar(valor) {
                const hora = new Date().toLocaleTimeString();
                this.chart.data.labels.push(hora);
                this.chart.data.datasets[0].data.push(valor);
                if (this.chart.data.labels.length > 15) {
                    this.chart.data.labels.shift();
                    this.chart.data.datasets[0].data.shift();
                }
                this.chart.update();
            }
        }

        // --- INSTANCIANDO OS OBJETOS (Onde a mágica começa) ---
        const monitorCPU = new CardHardware('card-cpu', 'cpu-text', 80);
        const monitorRAM = new CardHardware('card-ram', 'ram-text', 14);
        const monitorTemp = new CardHardware('card-temp', 'temp-text', 70);
        const graficoPrincipal = new GraficoMonitor('loadChart');

        // --- ESCUTANDO O SERVIDOR ---
        socket.on('serverData', (data) => {
            // Chamando o método exatamente como solicitado: atualizarInterface(valor, tipo)
            monitorCPU.atualizarInterface(data.cpu, "%");
            monitorRAM.atualizarInterface(data.ram, "GB");
            monitorTemp.atualizarInterface(data.temp, "°C");

            // Atualiza o gráfico com o valor da CPU
            graficoPrincipal.desenhar(data.cpu);
        });

        socket.on('disconnect', () => {
            const status = document.getElementById('status-io');
            if (status) status.innerText = '🔴 Offline';
        });
    </script>
</body>

</html>
